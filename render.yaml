databases :
  - name: tendaumbanda
    databaseName: tendaumbanda
    user : guiddiel
    plan: free

services :
  - type: web
    name: tendaumbanda
    runtime: ruby
    plan: free
    buildcownand: "./bin/render-build. sh"
    startConvnand : "bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase :
          name: tendaumbanda
          property : connectionString
      - key: RAILS_MASTER_KEY
        sync : false- key:WEB_CURRENCY
        value: 2